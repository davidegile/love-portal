[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "love-portal"
version = "0.1.0"
description = "Local Python webcam experience for heart gesture, portal unlock, and love letter reveal."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "jinja2>=3.1,<4.0",
    "opencv-python>=4.10,<5.0",
    "mediapipe>=0.10,<1.0",
    "pywebview>=5.3,<6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "httpx>=0.28,<1.0",
    "pyinstaller>=6.11,<7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
