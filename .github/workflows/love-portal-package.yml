name: love-portal-package

on:
  workflow_dispatch:
  push:
    paths:
      - "**"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run tests
        shell: pwsh
        run: python -m pytest
      - name: Build exe
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: love-portal-windows
          path: dist/LovePortal.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run tests
        run: python -m pytest
      - name: Build app and dmg
        run: bash ./scripts/build_macos.sh
      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: love-portal-macos-app
          path: dist/LovePortal.app
      - name: Upload macOS dmg
        uses: actions/upload-artifact@v4
        with:
          name: love-portal-macos-dmg
          path: dist/LovePortal.dmg
